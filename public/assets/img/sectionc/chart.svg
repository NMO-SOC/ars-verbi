<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-label="Bar graph: Westmere line services arriving on time fell from 88 per cent in mid 2023 to 69 per cent in mid 2025">
  <rect width="560" height="340" fill="#fff"/>
  <text x="280" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#111">Westmere line: services arriving on time (%)</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333">
    <!-- gridlines + y labels: y = 280 - v*2.2 -->
    <g stroke="#d4d4d4" stroke-width="1">
      <path d="M60 280 H540 M60 236 H540 M60 192 H540 M60 148 H540 M60 104 H540 M60 60 H540"/>
    </g>
    <text x="50" y="284" text-anchor="end">0</text>
    <text x="50" y="240" text-anchor="end">20</text>
    <text x="50" y="196" text-anchor="end">40</text>
    <text x="50" y="152" text-anchor="end">60</text>
    <text x="50" y="108" text-anchor="end">80</text>
    <text x="50" y="64" text-anchor="end">100</text>
    <!-- bars: width 40, step 60, starting x 78 -->
    <g fill="#8a8a8a" stroke="#333" stroke-width="1">
      <rect x="78"  y="86.4"  width="40" height="193.6"/>
      <rect x="138" y="93"    width="40" height="187"/>
      <rect x="198" y="97.4"  width="40" height="182.6"/>
      <rect x="258" y="106.2" width="40" height="173.8"/>
      <rect x="318" y="112.8" width="40" height="167.2"/>
      <rect x="378" y="117.2" width="40" height="162.8"/>
      <rect x="438" y="123.8" width="40" height="156.2"/>
      <rect x="498" y="128.2" width="40" height="151.8" fill="#4d4d4d"/>
    </g>
    <g font-weight="700" fill="#111" text-anchor="middle">
      <text x="98" y="80">88</text><text x="158" y="87">85</text><text x="218" y="91">83</text><text x="278" y="100">79</text>
      <text x="338" y="107">76</text><text x="398" y="111">74</text><text x="458" y="118">71</text><text x="518" y="122">69</text>
    </g>
    <g text-anchor="middle">
      <text x="98" y="298">Jul–Sep</text><text x="98" y="312">2023</text>
      <text x="158" y="298">Oct–Dec</text><text x="158" y="312">2023</text>
      <text x="218" y="298">Jan–Mar</text><text x="218" y="312">2024</text>
      <text x="278" y="298">Apr–Jun</text><text x="278" y="312">2024</text>
      <text x="338" y="298">Jul–Sep</text><text x="338" y="312">2024</text>
      <text x="398" y="298">Oct–Dec</text><text x="398" y="312">2024</text>
      <text x="458" y="298">Jan–Mar</text><text x="458" y="312">2025</text>
      <text x="518" y="298">Apr–Jun</text><text x="518" y="312">2025</text>
    </g>
    <path d="M60 280 H540" stroke="#111" stroke-width="1.5"/>
    <text x="60" y="332" font-size="11" fill="#555">Source: Westmere Rail Users Group. 'On time' = within five minutes of the timetable.</text>
  </g>
</svg>
