<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Video thumbnail: a pair of patched jeans with a needle and thread, and the words Stop hauling. Start mending.">
  <rect width="640" height="360" fill="#3a3a3a"/>
  <!-- workbench texture -->
  <g stroke="#454545" stroke-width="2">
    <path d="M0 60 H640 M0 130 H640 M0 200 H640 M0 270 H640 M0 340 H640"/>
  </g>
  <!-- jeans -->
  <g stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round">
    <path d="M360 40 H560 L590 330 H488 L462 150 L436 330 H334 Z" fill="#8c8c8c"/>
    <path d="M360 40 H560 V72 H360 Z" fill="#777"/>
    <path d="M398 72 q-6 40 34 46 M522 72 q6 40 -34 46" fill="none" stroke="#5c5c5c" stroke-width="2.5"/>
    <!-- patch -->
    <rect x="382" y="204" width="54" height="50" rx="4" fill="#d6d6d6" transform="rotate(6 409 229)"/>
    <rect x="388" y="210" width="42" height="38" rx="3" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5 4" transform="rotate(6 409 229)"/>
  </g>
  <!-- needle and thread -->
  <g stroke-linecap="round">
    <path d="M520 214 L590 166" stroke="#efefef" stroke-width="5"/>
    <ellipse cx="584" cy="170" rx="5" ry="2.5" fill="#3a3a3a" transform="rotate(-34 584 170)"/>
    <path d="M586 168 C620 150 600 230 560 250 C530 266 500 250 470 262" fill="none" stroke="#e0e0e0" stroke-width="2.5"/>
  </g>
  <!-- headline -->
  <rect x="26" y="104" width="292" height="152" fill="#ffffff"/>
  <text x="44" y="164" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#111">STOP</text>
  <text x="44" y="206" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#111">HAULING.</text>
  <text x="44" y="242" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="27" fill="#111">START MENDING.</text>
  <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#fff">SECOND STITCH</text>
  <!-- play button -->
  <circle cx="462" cy="122" r="34" fill="#000" fill-opacity=".55" stroke="#fff" stroke-width="3"/>
  <path d="M452 104 L478 122 L452 140 Z" fill="#fff"/>
  <!-- duration -->
  <rect x="566" y="322" width="60" height="26" rx="4" fill="#000" fill-opacity=".75"/>
  <text x="596" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff">6:42</text>
</svg>
