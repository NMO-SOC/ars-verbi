    <path d="M222 150 C262 112 268 88 252 70 C262 104 246 120 226 132 Z" fill="#9a9a9a"/>
    <path d="M226 160 C276 140 290 116 282 96 C282 126 258 140 230 146 Z" fill="#7d7d7d"/>
