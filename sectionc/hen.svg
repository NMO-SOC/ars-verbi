    <!-- clipboard -->
    <rect x="58" y="156" width="70" height="88" rx="6" fill="#fff" transform="rotate(-8 93 200)"/>
    <rect x="80" y="150" width="26" height="12" rx="3" fill="#888" transform="rotate(-8 93 200)"/>
    <g stroke-width="2.5" transform="rotate(-8 93 200)">
