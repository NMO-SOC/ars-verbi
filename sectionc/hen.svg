    <path d="M140 228 L132 272 M132 272 l-16 6 M132 272 l2 10 M132 272 l14 6" fill="none"/>
    <path d="M178 228 L186 272 M186 272 l-14 6 M186 272 l-2 10 M186 272 l16 6" fill="none"/>
