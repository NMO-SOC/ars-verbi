# GitHub Pages deployment (optional — for hosting the same site on GitHub)
# Upload and deploy run as separate jobs (GitHub's standard Pages template):
# deploying in the same job as the upload sometimes ran before the artifact
# was visible, failing with 'No artifacts named "github-pages" were found'.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ask Appleyard: make sure the bot's embeddings match the search index being deployed. Only changed chunks
      # are re-embedded (cache in worker/embed-cache.json). If the Worker is down, deploy with the previous ones.
      - name: Update Ask Appleyard embeddings
        run: python3 make_embeddings.py || echo "::warning::Embeddings not updated (Worker unavailable); deploying the previous ones"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
